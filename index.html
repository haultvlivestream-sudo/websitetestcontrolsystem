<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control System - IHYA' 7 TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }

        #lock-screen {
            background: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: var(--shadow);
            width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--border-color);
        }
        .pin-input {
            width: 100%; padding: 0.75rem; font-size: 1.5rem; letter-spacing: 0.5rem;
            text-align: center; border: 2px solid var(--border-color); border-radius: 8px; outline: none; margin-bottom: 1rem;
        }
        .btn-submit {
            width: 100%; padding: 0.75rem; background-color: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer;
        }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; display: none; }

        #dashboard { display: none; width: 100%; max-width: 1000px; }
        header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; cursor: pointer; position: relative; }
        .card-number { position: absolute; top: 10px; right: 15px; font-size: 1.8rem; font-weight: 700; color: #f1f5f9; }
        .card-badge { display: inline-block; background: #e0e7ff; color: var(--primary); font-size: 0.75rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; margin-bottom: 0.5rem; }

        /* TABEL RIWAYAT */
        .history-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow); }
        .history-section h2 { font-size: 1.2rem; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8fafc; color: var(--text-muted); }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-failure { background: #fee2e2; color: #991b1b; }
        .status-in_progress { background: #fef3c7; color: #92400e; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 16px; width: 100%; max-width: 480px; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; }
    </style>
</head>
<body>

    <!-- LOCK SCREEN -->
    <div id="lock-screen">
        <h2>Control System</h2>
        <p style="margin-bottom:1rem; font-size:0.875rem; color:var(--text-muted);">Masukkan PIN Akses</p>
        <input type="password" id="pin-input" class="pin-input" maxlength="6" placeholder="******">
        <button class="btn-submit" id="login-btn" onclick="unlockDashboard()">Masuk</button>
        <div id="error-msg" class="error-msg"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <header>
            <h1>Control Panel <span>IHYA' 7 TV</span></h1>
            <button onclick="logout()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">Keluar</button>
        </header>

        <div class="grid-container">
            <div class="card" onclick="openModal('1. Live Fix Tertinggi', 'livefixtertinggi.yml')">
                <span class="card-number">01</span>
                <div><span class="card-badge">livefixtertinggi.yml</span><h4>1. Live Fix Tertinggi</h4></div>
            </div>
            <div class="card" onclick="openModal('2. Live Fix Agust Logo Kiri Atas', 'Scriptpercobaan.yml')">
                <span class="card-number">02</span>
                <div><span class="card-badge">Scriptpercobaan.yml</span><h4>2. Live Fix Agust Logo</h4></div>
            </div>
            <div class="card" onclick="openModal('3. Live Khusus Habib Umar', 'scriptkhususlivehabibomarcom.yml')">
                <span class="card-number">03</span>
                <div><span class="card-badge">scriptkhususlivehabibomarcom.yml</span><h4>3. Live Habib Umar</h4></div>
            </div>
        </div>

        <!-- MENU RIWAYAT WORKFLOW -->
        <div class="history-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>Riwayat Aktivitas Live</h2>
                <button onclick="fetchHistory()" style="padding:4px 8px; cursor:pointer;">Refresh</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Workflow</th>
                        <th>Status</th>
                        <th>Waktu</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr><td colspan="3" style="text-align:center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div id="action-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-bottom:1rem;">Judul Live</h3>
            <form id="live-form" onsubmit="triggerGithubAction(event)">
                <input type="hidden" id="selected-yml">
                <div class="form-group">
                    <label>Link YouTube</label>
                    <input type="url" id="yt-url" required>
                </div>
                <div class="form-group">
                    <label>Stream Key RTMP</label>
                    <input type="password" id="rtmp-key" required>
                </div>
                <button type="submit" class="btn-submit" id="submit-btn">Jalankan Live</button>
                <button type="button" onclick="closeModal()" style="width:100%; margin-top:0.5rem; padding:0.5rem; background:none; border:none; cursor:pointer;">Batal</button>
            </form>
        </div>
    </div>

    <script>
        let userPin = "";

        async function unlockDashboard() {
            const input = document.getElementById('pin-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            if (!input) return;

            try {
                const response = await fetch(`/api/status?pin=${encodeURIComponent(input)}`);
                const result = await response.json();

                if (response.ok) {
                    userPin = input;
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    renderHistory(result.runs);
                } else {
                    errorMsg.innerText = result.message || "PIN Salah!";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = "Gagal terhubung ke server.";
                errorMsg.style.display = 'block';
            }
        }

        async function fetchHistory() {
            try {
                const response = await fetch(`/api/status?pin=${encodeURIComponent(userPin)}`);
                const result = await response.json();
                if (response.ok) renderHistory(result.runs);
            } catch (err) { console.error(err); }
        }

        function renderHistory(runs) {
            const tbody = document.getElementById('history-table-body');
            if (!runs || runs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada riwayat.</td></tr>';
                return;
            }
            tbody.innerHTML = runs.map(run => `
                <tr>
                    <td><strong>${run.name}</strong></td>
                    <td><span class="status-badge status-${run.status === 'completed' ? run.conclusion : run.status}">${run.status === 'completed' ? run.conclusion : run.status}</span></td>
                    <td>${new Date(run.created_at).toLocaleString('id-ID')}</td>
                </tr>
            `).join('');
        }

        function logout() { location.reload(); }
        function openModal(title, yml) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('selected-yml').value = yml;
            document.getElementById('action-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('action-modal').style.display = 'none'; }

        async function triggerGithubAction(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/trigger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pin: userPin,
                        targetYml: document.getElementById('selected-yml').value,
                        ytUrl: document.getElementById('yt-url').value,
                        rtmpKey: document.getElementById('rtmp-key').value
                    })
                });
                const result = await response.json();
                if (response.ok) {
                    alert(`BERHASIL: ${result.message}`);
                    closeModal();
                    fetchHistory();
                } else {
                    alert(`GAGAL: ${result.message}\nDetail: ${result.error || ''}`);
                }
            } catch (err) { alert("Terjadi kesalahan koneksi."); }
            finally { btn.innerText = "Jalankan Live"; btn.disabled = false; }
        }
    </script>
</body>
    </html>
